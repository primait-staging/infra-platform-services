version: 2
updates:
  - package-ecosystem: pip
    directories:
      - "*"
    insecure-external-code-execution: allow
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    directory: /
